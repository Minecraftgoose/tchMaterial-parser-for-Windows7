[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tchMaterial-parser-for-Windows7"
version = "1.0"
description = "国家中小学智慧教育平台 资源下载工具"
readme = "README.md"
requires-python = ">=3.8,<3.9"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
authors = [
    {name = "肥宅水水呀"}, {name = "晨叶梦春", email = "wuziqian211@126.com"}, # 上游作者
    {name = "Minecraftgoose", email = "Minecraftgoose@users.noreply.github.com"}, # 本分支（Windows 7 适配）
]
dependencies = [
    "pillow>=10,<13",
    "psutil>=5.9,<8",
    "pypdf>=5,<7",
    "requests>=2.31,<3",
    "sv-ttk>=2.6,<3",
    "pywin32>=306,<312",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 7",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Topic :: Education",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Minecraftgoose/tchMaterial-parser-for-Windows7"
Repository = "https://github.com/Minecraftgoose/tchMaterial-parser-for-Windows7"
Issues = "https://github.com/Minecraftgoose/tchMaterial-parser-for-Windows7/issues"

[project.scripts]
"tchmaterial-parser-for-windows7" = "tchmaterial_parser.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tchmaterial_parser = ["assets/*.png"]

[tool.black]
line-length = 120
target-version = ["py38"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-q"
testpaths = ["tests"]
